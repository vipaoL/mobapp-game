name: Build All Platforms

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  Build-Android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" "platforms;android-34" "build-tools;36.0.0"

      - name: Build Release
        run: cd android/ && ant clean release

      - name: Build Debug
        run: cd android/ && ant debug

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: mobapp-game-android
          path: ${{ github.workspace }}/android/build/outputs/apk/*

  Build-Desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Ant
        run: cd desktop/ && ant jar

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: mobapp-game-desktop
          path: ${{ github.workspace }}/desktop/build/libs/*.jar

  Build-IOS:
    # Best-effort: RoboVM (MobiVM 2.3.22) is unmaintained and may break with
    # newer Xcode on GitHub runner images; keep continue-on-error until stable.
    # macos-13 (Intel) is the oldest available image: Temurin JDK 8 has no
    # macOS arm64 builds, so arm64 images (macos-14/15) cannot be used here.
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Show toolchain versions
        run: |
          java -version
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Build with Gradle (RoboVM)
        run: cd ios/ && ./gradlew --no-daemon createIPA

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: mobapp-game-ios
          path: ${{ github.workspace }}/ios/build/robovm/*
          if-no-files-found: warn

  Build-J2ME:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download ProGuard 6.2.2
        run: |
          curl -L -o proguard6.2.2.tar.gz https://master.dl.sourceforge.net/project/proguard/proguard/6.2/proguard6.2.2.tar.gz
          tar -xzf proguard6.2.2.tar.gz -C j2me

      - name: Download Microemulator for J2ME API
        run: |
          curl -L -o microemulator-2.0.4.zip https://master.dl.sourceforge.net/project/microemulator/microemulator/2.0.4/microemulator-2.0.4.zip
          unzip -q microemulator-2.0.4.zip
          mkdir -p j2me/lib
          cp microemulator-2.0.4/lib/*.jar j2me/lib/

      - name: Download JSR-256
        run: curl -L -o j2me/lib/jsr256.jar https://raw.githubusercontent.com/vipaoL/j2me-build-tools/master/lib/jsr256.jar

      - name: Build
        run: j2me/build.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: mobapp-game-j2me
          path: ${{ github.workspace }}/j2me/bin/mobapp-game-j2me-*.jar
