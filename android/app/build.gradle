import com.android.build.api.artifact.ArtifactTransformationRequest
import com.android.build.api.artifact.SingleArtifact

import javax.inject.Inject

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.grgit)
}

def getVersionName = { ->
    def description = grgit.describe(tags: true, always: true)
    def status = grgit.status()

    if (status.staged.allChanges || status.unstaged.modified || status.unstaged.removed || status.conflicts) {
        return description + "-dirty"
    }

    return description
}

def gitVersion = getVersionName()

project.logger.lifecycle("Version (git): " + gitVersion)

android {
    namespace 'io.github.vipaol.mobapp.game'
